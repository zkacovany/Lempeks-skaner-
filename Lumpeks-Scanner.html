<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Lumpeks Scanner</title><style>body{font-family:system-ui;margin:0;background:#f4f4f4;color:#111}header{background:#111;color:white;padding:18px}main{max-width:650px;margin:auto;padding:15px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0}input,button{width:100%;padding:13px;margin:6px 0;border-radius:12px;box-sizing:border-box}button{border:0;font-weight:800;background:#111;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{background:#eee;padding:12px;border-radius:12px}.decision{text-align:center;padding:15px;border-radius:14px;font-size:23px;font-weight:900}img{max-width:100%;max-height:350px;display:none;margin-top:10px;border-radius:12px}.muted{color:#777;font-size:13px}</style></head><body><header><h2>🧥 Lumpeks Scanner</h2><small>Znajdź rzeczy z potencjałem na Vinted</small></header><main><section class="card"><b>📸 Zdjęcie rzeczy lub metki</b><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview"><div class="grid"><div><small>Cena zakupu</small><input id="buy" type="number" value="10"></div><div><small>Min. zysk</small><input id="min" type="number" value="40"></div></div><button onclick="analyze()">🔎 ANALIZUJ RZECZ</button><p id="status" class="muted"></p></section><section id="result" class="card" style="display:none"><div id="decision" class="decision"></div><div class="grid"><div class="m"><small>Marka</small><br><b id="brand"></b></div><div class="m"><small>Typ</small><br><b id="type"></b></div><div class="m"><small>Sprzedaż</small><br><b id="sell"></b></div><div class="m"><small>Maks. zakup</small><br><b id="max"></b></div><div class="m"><small>Zysk</small><br><b id="profit"></b></div><div class="m"><small>Rozmiar</small><br><b id="size"></b></div></div><p id="notes"></p></section><section class="card"><b>⚙️ Klucz OpenAI</b><input id="api" type="password" placeholder="Wklej klucz API"><button onclick="save()">Zapisz</button><p class="muted">Klucz jest przechowywany lokalnie na tym urządzeniu. Ta wersja jest prywatnym prototypem.</p></section><section class="card"><b>📚 Historia</b><div id="hist" class="muted"></div><button onclick="localStorage.removeItem('hist');load()">Wyczyść</button></section></main><script>
let img="";api.value=localStorage.getItem("api")||"";photo.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{img=r.result;preview.src=img;preview.style.display="block"};r.readAsDataURL(f)};function save(){localStorage.setItem("api",api.value.trim());alert("Zapisano");}
async function analyze(){status.textContent="Analizuję…";let key=localStorage.getItem("api");if(!key||!img){render({brand:key?"Brak zdjęcia":"Tryb demo",type:"—",size:"—",sell_price:0,notes:["Dodaj zdjęcie i klucz API, aby wykonać analizę AI."]});status.textContent="Gotowe";return}try{let p=`Przeanalizuj zdjęcie ubrania pod kątem odsprzedaży na Vinted Polska. Rozpoznaj markę, typ, rozmiar jeśli widoczny i realistyczną orientacyjną cenę sprzedaży. Zwróć wyłącznie JSON: {"brand":"","type":"","size":"","sell_price":0,"notes":[""]}`;let r=await fetch("https://api.openai.com/v1/responses",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:"gpt-5.6",input:[{role:"user",content:[{type:"input_text",text:p},{type:"input_image",image_url:img}]}]})});let j=await r.json();let x=JSON.parse((j.output_text||"").replace(/```json|```/g,"").trim());render(x);status.textContent="Gotowe"}catch(e){status.textContent="Błąd: "+e.message}}
function render(x){let b=+buy.value||0,s=+x.sell_price||0,m=+min.value||40,p=Math.max(0,s-b),max=Math.max(0,s-m);let d=p>=m*1.5?"🟢 BIERZ":p>=m?"🟡 WARTO SPRAWDZIĆ":p>0?"🟠 TYLKO TANIO":"🔴 ODPUŚĆ";decision.textContent=d;brand.textContent=x.brand||"—";type.textContent=x.type||"—";sell.textContent=s+" zł";window["max"].textContent=max+" zł";profit.textContent=p+" zł";size.textContent=x.size||"—";notes.innerHTML="<b>Uwagi:</b> "+(x.notes||[]).join(" • ");result.style.display="block";let h=JSON.parse(localStorage.getItem("hist")||"[]");h.unshift(new Date().toLocaleString("pl-PL")+" — "+(x.brand||"—")+" — zakup "+b+" zł — zysk "+p+" zł — "+d);localStorage.setItem("hist",JSON.stringify(h.slice(0,50)));load()}function load(){hist.innerHTML=(JSON.parse(localStorage.getItem("hist")||"[]")).map(x=>"<p>"+x+"</p>").join("")||"Brak skanów"}load();</script></body></html>
